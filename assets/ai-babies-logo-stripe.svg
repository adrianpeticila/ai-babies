<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@700;900&amp;display=swap');
      .mono-title {
        font-family: 'Space Mono', 'SF Pro Display', -apple-system, monospace, sans-serif;
        font-weight: 900;
        letter-spacing: 4px;
        fill: #FFFFFF;
      }
      .mono-sub {
        font-family: 'Space Mono', -apple-system, monospace, sans-serif;
        font-weight: 700;
        letter-spacing: 3px;
        fill: #9CA3AF;
      }
    </style>
  </defs>

  <!-- Solid Pure Black Canvas -->
  <rect width="512" height="512" fill="#000000" />

  <!-- Outer Minimal Engineering Frame (Within Safe Zone) -->
  <rect x="24" y="24" width="464" height="464" rx="16" fill="none" stroke="#262626" stroke-width="2" />
  <rect x="36" y="36" width="440" height="440" rx="10" fill="none" stroke="#171717" stroke-width="1" stroke-dasharray="6,6" />

  <!-- Baby Robot Icon (Centered in Upper Half, Safe from Round Crop) -->
  <g transform="translate(146, 68)">
    <!-- Shadow Box Brutalist Accent -->
    <rect x="6" y="6" width="220" height="220" rx="20" fill="#1F2937" />
    <!-- Robot Face Outer Frame -->
    <rect x="0" y="0" width="220" height="220" rx="20" fill="#000000" stroke="#FFFFFF" stroke-width="6" />

    <!-- Antenna -->
    <line x1="110" y1="-26" x2="110" y2="0" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
    <circle cx="110" cy="-34" r="10" fill="#FFFFFF" />

    <!-- Robot Ear Bolts -->
    <rect x="-10" y="85" width="10" height="30" rx="3" fill="#FFFFFF" />
    <rect x="220" y="85" width="10" height="30" rx="3" fill="#FFFFFF" />

    <!-- Inner Screen Visor -->
    <rect x="25" y="45" width="170" height="75" rx="10" fill="#111827" stroke="#FFFFFF" stroke-width="4" />

    <!-- Pixel / Glowing Eyes -->
    <circle cx="65" cy="82" r="14" fill="#FFFFFF" />
    <circle cx="155" cy="82" r="14" fill="#FFFFFF" />
    <!-- Neural bridge between eyes -->
    <line x1="85" y1="82" x2="135" y2="82" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="4,4" />

    <!-- Baby Pacifier / Hardware Jack Connector -->
    <circle cx="110" cy="155" r="18" fill="#111827" stroke="#FFFFFF" stroke-width="5" />
    <rect x="102" y="147" width="16" height="16" rx="2" fill="#FFFFFF" />
    <path d="M 94 165 C 94 185, 126 185, 126 165" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />

    <!-- Corner Technical Ticks -->
    <line x1="14" y1="14" x2="26" y2="14" stroke="#FFFFFF" stroke-width="2" />
    <line x1="14" y1="14" x2="14" y2="26" stroke="#FFFFFF" stroke-width="2" />
    <line x1="206" y1="14" x2="194" y2="14" stroke="#FFFFFF" stroke-width="2" />
    <line x1="206" y1="14" x2="206" y2="26" stroke="#FFFFFF" stroke-width="2" />
  </g>

  <!-- Typography Brand Text -->
  <text x="256" y="375" class="mono-title" font-size="34" text-anchor="middle">AI FOR BABIES</text>
  
  <!-- Subtle Subtitle / Badge -->
  <rect x="136" y="405" width="240" height="28" rx="4" fill="#111827" stroke="#374151" stroke-width="1.5" />
  <text x="256" y="424" class="mono-sub" font-size="11" text-anchor="middle">NO HYPE · PURE SIGNAL</text>

  <!-- Tech Status Dots -->
  <circle cx="110" cy="419" r="3" fill="#22C55E" />
  <circle cx="402" cy="419" r="3" fill="#22C55E" />
</svg>
