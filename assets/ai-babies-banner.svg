    <text x="10" y="48" fill="#ffffff" class="font-sans" font-size="14" font-weight="800">WebMCP Tools</text>
    <text x="10" y="70" fill="#94a3b8" class="font-sans" font-size="11">Browser Protocol Specs</text>
