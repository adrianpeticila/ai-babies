<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" style="background:#090a0f;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090e" />
      <stop offset="50%" stop-color="#0d0f17" />
      <stop offset="100%" stop-color="#06070a" />
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>

    <linearGradient id="neon-title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.6" />
      <stop offset="30%" stop-color="#7000ff" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#00ff88" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ff5500" stop-opacity="0.6" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141724" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0d0f18" stop-opacity="0.95" />
    </linearGradient>

    <!-- Patterns -->
    <pattern id="cyber-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1c2333" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="0" cy="0" r="1" fill="#00f0ff" fill-opacity="0.25" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-subtle" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'Space Mono', 'SF Mono', Menlo, Consolas, Monaco, monospace; }
    .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bg-grad)" />

  <!-- Cyber Grid Overlay -->
  <rect width="1200" height="360" fill="url(#cyber-grid)" />

  <!-- Neon Ambient Glow Orbs -->
  <circle cx="150" cy="80" r="180" fill="#00f0ff" fill-opacity="0.04" filter="url(#glow)" />
  <circle cx="1050" cy="280" r="220" fill="#7000ff" fill-opacity="0.05" filter="url(#glow)" />
  <circle cx="650" cy="180" r="150" fill="#00ff88" fill-opacity="0.03" filter="url(#glow)" />

  <!-- Outer Frame Border -->
  <rect x="12" y="12" width="1176" height="336" rx="10" fill="none" stroke="url(#border-grad)" stroke-width="1.5" />

  <!-- Corner Tech Crosshairs -->
  <path d="M 8 20 L 20 20 M 20 8 L 20 20" stroke="#00f0ff" stroke-width="2" fill="none" />
  <path d="M 1192 20 L 1180 20 M 1180 8 L 1180 20" stroke="#7000ff" stroke-width="2" fill="none" />
  <path d="M 8 340 L 20 340 M 20 352 L 20 340" stroke="#00ff88" stroke-width="2" fill="none" />
  <path d="M 1192 340 L 1180 340 M 1180 352 L 1180 340" stroke="#ff5500" stroke-width="2" fill="none" />

  <!-- ==================== LEFT BRANDING HERO SECTION ==================== -->

  <!-- Top Category Pill Badge -->
  <g transform="translate(42, 38)">
    <rect x="0" y="0" width="282" height="24" rx="4" fill="#0c1929" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="12" cy="12" r="4" fill="#00ff88" filter="url(#glow-subtle)" />
    <text x="24" y="16" fill="#00f0ff" class="font-mono" font-size="10.5" font-weight="700" letter-spacing="1">INTERACTIVE AI SUITE : LIVE</text>
  </g>

  <!-- Main Suite Title -->
  <text x="42" y="104" fill="url(#neon-title)" class="font-sans" font-size="44" font-weight="900" letter-spacing="-1.5">AI FOR BABIES</text>

  <!-- Tagline -->
  <text x="42" y="134" fill="#00f0ff" class="font-sans" font-size="16" font-weight="700" letter-spacing="-0.2">AI Explained for People with Actual Jobs.</text>

  <!-- Description Body -->
  <text x="42" y="165" fill="#94a3b8" class="font-sans" font-size="12.5" font-weight="400">Interactive engineering suite breaking down LLMs, RAG,</text>
  <text x="42" y="183" fill="#94a3b8" class="font-sans" font-size="12.5" font-weight="400">multi-agent architectures, and inference speedups.</text>
  <text x="42" y="201" fill="#64748b" class="font-sans" font-size="12" font-weight="500">Zero-dependency pure web primitives : Production grade</text>

  <!-- Tech Spec Metrics Pills -->
  <g transform="translate(42, 222)">
    <!-- Pill 1: 106 Terms -->
    <rect x="0" y="0" width="86" height="24" rx="4" fill="#131722" stroke="#334155" stroke-width="1" />
    <text x="8" y="16" fill="#f1f5f9" class="font-mono" font-size="11" font-weight="600">⚡ 106 Terms</text>

    <!-- Pill 2: 8 Modules -->
    <rect x="94" y="0" width="92" height="24" rx="4" fill="#131722" stroke="#334155" stroke-width="1" />
    <text x="102" y="16" fill="#00ff88" class="font-mono" font-size="11" font-weight="600">📦 8 Modules</text>

    <!-- Pill 3: 0 Deps -->
    <rect x="194" y="0" width="82" height="24" rx="4" fill="#131722" stroke="#334155" stroke-width="1" />
    <text x="202" y="16" fill="#ff5500" class="font-mono" font-size="11" font-weight="600">🔥 0-Deps</text>

    <!-- Pill 4: WebMCP -->
    <rect x="284" y="0" width="84" height="24" rx="4" fill="#131722" stroke="#334155" stroke-width="1" />
    <text x="292" y="16" fill="#00f0ff" class="font-mono" font-size="11" font-weight="600">🌐 WebMCP</text>
  </g>

  <!-- Live Deployment & Domain Anchor Footer -->
  <g transform="translate(42, 280)">
    <rect x="0" y="0" width="370" height="42" rx="6" fill="#0d111a" stroke="#1e293b" stroke-width="1" />
    <text x="14" y="26" fill="#38bdf8" class="font-mono" font-size="12" font-weight="700">aiforbabies.pages.dev</text>
    <text x="195" y="26" fill="#64748b" class="font-mono" font-size="11">|</text>
    <text x="210" y="26" fill="#a855f7" class="font-mono" font-size="11" font-weight="600">github.com/adrianpeticila</text>
  </g>

  <!-- ==================== RIGHT 8 MODULE CARDS (4x2 GRID) ==================== -->

  <!-- ROW 1 (y=34, h=136) -->

  <!-- CARD 1: Prompt Engine -->
  <g transform="translate(445, 34)">
    <rect x="0" y="0" width="168" height="136" rx="6" fill="url(#card-bg)" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.8" />
    <rect x="0" y="0" width="168" height="3" fill="#00f0ff" />
    <rect x="10" y="10" width="66" height="16" rx="3" fill="#00f0ff" fill-opacity="0.15" />
    <text x="14" y="22" fill="#00f0ff" class="font-mono" font-size="9" font-weight="700">MODULE 01</text>
    <text x="10" y="48" fill="#ffffff" class="font-sans" font-size="14" font-weight="800">Prompt Engine</text>
    <text x="10" y="70" fill="#94a3b8" class="font-sans" font-size="11">Few-Shot • CoT</text>
    <text x="10" y="87" fill="#94a3b8" class="font-sans" font-size="11">ReAct • Tree of Thoughts</text>
