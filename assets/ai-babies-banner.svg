<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" style="background:#ffffff; font-family:'Space Mono', monospace, sans-serif;">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f0f0f0" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Grid -->
  <rect width="1200" height="630" fill="#ffffff" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Outer Brutalist Border & Shadow -->
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#000000" stroke-width="4" />
  <rect x="32" y="32" width="1152" height="582" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="4,4" />

  <!-- Header Pill -->
  <rect x="50" y="50" width="360" height="36" fill="#000000" />
  <text x="65" y="74" fill="#ffffff" font-size="14" font-weight="700" letter-spacing="2">ENGINEERING SPECIFICATION // V2.4</text>

  <rect x="420" y="50" width="220" height="36" fill="#f9f9f9" stroke="#000000" stroke-width="2" />
  <text x="435" y="74" fill="#000000" font-size="13" font-weight="700" letter-spacing="1">ZERO HYPETEXT</text>

  <!-- Baby Robot / AI Brain Icon -->
  <g transform="translate(900, 70)">
    <!-- Shadow Box -->
    <rect x="8" y="8" width="220" height="220" fill="#000000" />
    <rect x="0" y="0" width="220" height="220" fill="#ffffff" stroke="#000000" stroke-width="4" />
    
    <!-- Antenna -->
    <line x1="110" y1="20" x2="110" y2="45" stroke="#000000" stroke-width="4" />
    <circle cx="110" cy="16" r="8" fill="#000000" />
    
    <!-- Robot Head Frame -->
    <rect x="45" y="45" width="130" height="110" rx="4" fill="#f9f9f9" stroke="#000000" stroke-width="4" />
    
    <!-- Visor / Eyes Screen -->
    <rect x="60" y="65" width="100" height="35" rx="2" fill="#000000" />
    <circle cx="85" cy="82" r="6" fill="#ffffff" />
    <circle cx="135" cy="82" r="6" fill="#ffffff" />
    <line x1="91" y1="82" x2="129" y2="82" stroke="#ffffff" stroke-width="2" stroke-dasharray="2,2" />
    
    <!-- Pacifier / Connector -->
    <circle cx="110" cy="120" r="12" fill="#ffffff" stroke="#000000" stroke-width="3" />
    <rect x="104" y="114" width="12" height="12" fill="#000000" />
    <path d="M 98 126 C 98 140, 122 140, 122 126" fill="none" stroke="#000000" stroke-width="3" />

    <!-- Neural Circuit Traces -->
    <line x1="20" y1="180" x2="200" y2="180" stroke="#000000" stroke-width="2" />
    <circle cx="45" cy="180" r="4" fill="#000000" />
    <circle cx="110" cy="180" r="4" fill="#000000" />
    <circle cx="175" cy="180" r="4" fill="#000000" />
    <text x="110" y="204" fill="#000000" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">AGENT_NODE_01</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="50" y="170" fill="#000000" font-size="52" font-weight="900" letter-spacing="-1">AI FOR BABIES</text>
  <text x="50" y="215" fill="#111827" font-size="20" font-weight="700" letter-spacing="1">AI EXPLAINED FOR PEOPLE WITH ACTUAL JOBS</text>
  
  <line x1="50" y1="240" x2="850" y2="240" stroke="#000000" stroke-width="3" />

  <!-- Description Body -->
  <text x="50" y="280" fill="#374151" font-size="16" font-weight="500">
    <tspan x="50" dy="0">Frontier engineering reference suite. No corporate fluff or synthetic jargon.</tspan>
    <tspan x="50" dy="26">77 production-tested concepts, RAG simulators, AGENTS.md specs, and WebMCP tooling.</tspan>
  </text>

  <!-- Feature Grid Pills (5 Modules) -->
  <g transform="translate(50, 360)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="200" height="50" fill="#f9f9f9" stroke="#000000" stroke-width="3" />
    <rect x="5" y="5" width="20" height="40" fill="#000000" />
    <text x="35" y="31" fill="#000000" font-size="14" font-weight="700">PROMPT ENGINE</text>

    <!-- Tag 2 -->
    <rect x="220" y="0" width="180" height="50" fill="#f9f9f9" stroke="#000000" stroke-width="3" />
    <rect x="225" y="5" width="20" height="40" fill="#000000" />
    <text x="255" y="31" fill="#000000" font-size="14" font-weight="700">RAG COURSE</text>

    <!-- Tag 3 -->
    <rect x="420" y="0" width="210" height="50" fill="#f9f9f9" stroke="#000000" stroke-width="3" />
    <rect x="425" y="5" width="20" height="40" fill="#000000" />
    <text x="455" y="31" fill="#000000" font-size="14" font-weight="700">AI DICTIONARY</text>

    <!-- Tag 4 -->
    <rect x="650" y="0" width="190" height="50" fill="#f9f9f9" stroke="#000000" stroke-width="3" />
    <rect x="655" y="5" width="20" height="40" fill="#000000" />
    <text x="685" y="31" fill="#000000" font-size="14" font-weight="700">AGENT GYM</text>

    <!-- Tag 5 -->
    <rect x="860" y="0" width="230" height="50" fill="#000000" stroke="#000000" stroke-width="3" />
    <text x="895" y="31" fill="#ffffff" font-size="14" font-weight="700">WEBMCP PROTOCOL</text>
  </g>

  <!-- Bottom Bar Specs -->
  <g transform="translate(50, 480)">
    <rect x="0" y="0" width="1100" height="80" fill="#ffffff" stroke="#000000" stroke-width="2" />
    <line x1="275" y1="0" x2="275" y2="80" stroke="#000000" stroke-width="2" />
    <line x1="550" y1="0" x2="550" y2="80" stroke="#000000" stroke-width="2" />
    <line x1="825" y1="0" x2="825" y2="80" stroke="#000000" stroke-width="2" />

    <!-- Stat 1 -->
    <text x="20" y="32" fill="#6b7280" font-size="11" font-weight="700">DICTIONARY</text>
    <text x="20" y="60" fill="#000000" font-size="18" font-weight="800">77 TERMS // 7 CORES</text>

    <!-- Stat 2 -->
    <text x="295" y="32" fill="#6b7280" font-size="11" font-weight="700">RETRIEVAL ARCHITECTURE</text>
    <text x="295" y="60" fill="#000000" font-size="18" font-weight="800">HYBRID RRF + RERANK</text>

    <!-- Stat 3 -->
    <text x="570" y="32" fill="#6b7280" font-size="11" font-weight="700">MULTI-AGENT STD</text>
    <text x="570" y="60" fill="#000000" font-size="18" font-weight="800">AGENTS.MD STANDARD</text>

    <!-- Stat 4 -->
    <text x="845" y="32" fill="#6b7280" font-size="11" font-weight="700">CLIENT PROTOCOL</text>
    <text x="845" y="60" fill="#000000" font-size="18" font-weight="800">4 WEBMCP TOOLS</text>
  </g>
</svg>