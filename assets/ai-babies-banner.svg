    <text x="10" y="48" fill="#ffffff" class="font-sans" font-size="13.5" font-weight="800">106-Term Dict</text>
    <text x="10" y="70" fill="#94a3b8" class="font-sans" font-size="11">Interactive Search</text>
    <text x="10" y="87" fill="#94a3b8" class="font-sans" font-size="11">Real-World Examples</text>
    <rect x="10" y="106" width="148" height="18" rx="3" fill="#07090e" stroke="#1e293b" stroke-width="0.8" />
    <text x="16" y="119" fill="#00ff88" class="font-mono" font-size="9" font-weight="600">🔍 Real-time Filter</text>
  </g>

  <!-- CARD 4: Multi-Agent Specs -->
  <g transform="translate(985, 34)">
    <rect x="0" y="0" width="168" height="136" rx="6" fill="url(#card-bg)" stroke="#ff5500" stroke-width="1.2" stroke-opacity="0.8" />
    <rect x="0" y="0" width="168" height="3" fill="#ff5500" />
    <rect x="10" y="10" width="66" height="16" rx="3" fill="#ff5500" fill-opacity="0.2" />
    <text x="14" y="22" fill="#ff7a33" class="font-mono" font-size="9" font-weight="700">MODULE 04</text>
    <text x="10" y="48" fill="#ffffff" class="font-sans" font-size="14" font-weight="800">Multi-Agent Specs</text>
    <text x="10" y="70" fill="#94a3b8" class="font-sans" font-size="11">AGENTS.md Contract</text>
    <text x="10" y="87" fill="#94a3b8" class="font-sans" font-size="11">Orchestration &amp; State</text>
    <rect x="10" y="106" width="148" height="18" rx="3" fill="#07090e" stroke="#1e293b" stroke-width="0.8" />
    <text x="16" y="119" fill="#ff7a33" class="font-mono" font-size="9" font-weight="600">🤖 Autonomous Specs</text>
  </g>

  <!-- ROW 2 (y=186, h=136) -->

  <!-- CARD 5: Speed Lab -->
  <g transform="translate(445, 186)">
    <rect x="0" y="0" width="168" height="136" rx="6" fill="url(#card-bg)" stroke="#ff0055" stroke-width="1.2" stroke-opacity="0.8" />
    <rect x="0" y="0" width="168" height="3" fill="#ff0055" />
    <rect x="10" y="10" width="66" height="16" rx="3" fill="#ff0055" fill-opacity="0.15" />
    <text x="14" y="22" fill="#ff4d7d" class="font-mono" font-size="9" font-weight="700">MODULE 05</text>
    <text x="10" y="48" fill="#ffffff" class="font-sans" font-size="14" font-weight="800">Speed Lab</text>
    <text x="10" y="70" fill="#94a3b8" class="font-sans" font-size="11">TTFT • TPS • KV Cache</text>
    <text x="10" y="87" fill="#94a3b8" class="font-sans" font-size="11">Quantization &amp; MLX</text>
    <rect x="10" y="106" width="148" height="18" rx="3" fill="#07090e" stroke="#1e293b" stroke-width="0.8" />
    <text x="16" y="119" fill="#ff4d7d" class="font-mono" font-size="9" font-weight="600">🚀 Latency Simulator</text>
  </g>

